[PHP]
engine = On
short_open_tag = Off
asp_tags = Off
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /usr/local/var/log/php-errors.log
memory_limit = 2048M

realpath_cache_size	= 256K

;zend_extension=opcache.so

[apcu]
; The extension itself is installed in docker/php/Dockerfile; these are just its
; settings, and live here because this file is bind-mounted — change them and restart
; the container, no rebuild.
apc.enabled = 1
apc.shm_size = 64M

; Off on live (the default), so leave it off here too: the point of this container is
; to behave like the live server. Note the CLI SAPI gets its OWN segment anyway, so a
; CLI script can never see what FPM cached — which is exactly why the CLI static ship
; generator does not bother calling apcu_clear_cache(). Turn this on only to unit-test
; APCu logic in isolation, and remember it proves nothing about the web path.
apc.enable_cli = 0

[Date]
date.timezone = Europe/Helsinki

